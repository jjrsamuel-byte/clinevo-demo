<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinevo — AI Receptionist Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path d='M17.63,14.77 A9,9 0 1 1 17.63,5.23' fill='none' stroke='%23534AB7' stroke-width='2.2'/><path d='M14.75,12.97 A5.6,5.6 0 1 1 14.75,7.03' fill='none' stroke='%2345C4BC' stroke-width='1.5'/></svg>">
</head>
<body>
  <div class="pms-shell" id="app">
    <!-- Sidebar -->
    <aside class="pms-sidebar" id="sidebar"></aside>

    <!-- Top bar -->
    <header class="pms-topbar" id="topbar"></header>

    <!-- Main content area -->
    <main class="pms-main" id="main"></main>

    <!-- AI Receptionist drawer -->
    <aside class="pms-ai-drawer" id="ai-drawer"></aside>
  </div>

  <!-- Modal overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/eventemitter3@5/dist/eventemitter3.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
  <script>window.eventemitter3 = { EventEmitter: window.EventEmitter3 }; window.livekitClient = window.LivekitClient;</script>
  <script src="https://cdn.jsdelivr.net/npm/retell-client-js-sdk@2.0.7/dist/index.umd.js"></script>
  <script>window.RetellWebClient = window.retellClientJsSdk && window.retellClientJsSdk.RetellWebClient;</script>
  <script src="/js/retell-call.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/sse.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/topbar.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/calendar-grid.js"></script>
  <script src="/js/components/chat-transcript.js"></script>
  <script src="/js/components/notification-card.js"></script>
  <script src="/js/views/calendar.js"></script>
  <script src="/js/views/clients.js"></script>
  <script src="/js/views/patients.js"></script>
  <script src="/js/views/staff.js"></script>
  <script src="/js/views/comms.js"></script>
  <script src="/js/views/call-log.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/audit-log.js"></script>
  <script src="/js/views/ai-panel.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
